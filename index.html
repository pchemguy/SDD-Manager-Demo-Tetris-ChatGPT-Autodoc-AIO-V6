<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#09111d"><title>Tetris — Classic</title></head>
<body>
  <main class="shell">
    <header><a class="wordmark" href="./" aria-label="Tetris home"><span class="mark">▦</span> TETRIS<span class="edition">CLASSIC</span></a><span class="local"><i></i> LOCAL PLAY</span></header>
    <section class="game-layout" aria-label="Tetris game">
      <div class="board-frame"><div class="board-top"><span>PLAYFIELD</span><span id="status" aria-live="polite">READY</span></div><canvas id="board" width="280" height="560" tabindex="0" role="img" aria-label="Tetris board. Arrow keys move, Up rotates, Z rotates counterclockwise."></canvas><div class="board-bottom"><span>10 × 20</span><span>MAKE ROOM FOR MORE.</span></div></div>
      <aside><div class="intro"><p class="eyebrow">ONE MORE LINE.</p><h1>Find your<br>rhythm.</h1><p>Move. Rotate. Make room.</p></div><button id="start" type="button">Start game <span>↵</span></button><section class="card"><h2>Controls</h2><dl><div><dt>Move</dt><dd><kbd>←</kbd> <kbd>→</kbd></dd></div><div><dt>Soft drop</dt><dd><kbd>↓</kbd></dd></div><div><dt>Rotate</dt><dd><kbd>↑</kbd> <kbd>Z</kbd></dd></div></dl><p class="hint">Click the board to return keyboard focus.</p></section><p class="small-note">Your game stays on your device.</p></aside>
    </section><footer><span>STACK WITH INTENT.</span><span>BUILT FOR THE NEXT MOVE.</span></footer>
  </main><script type="module" src="/src/main.ts"></script>
</body></html>
